/* src/domain/entities/route-plan.js */
class RoutePlan {
  constructor(data) {
    const required = ['id', 'order', 'origin', 'destination', 'capacityKg', 'loadKg'];
    for (const field of required) if (data[field] == null) throw new Error(`RoutePlan: campo obrigatório ${field}`);
    Object.assign(this, structuredClone(data));
    Object.freeze(this.origin);
    Object.freeze(this.destination);
    if (this.coordinates) Object.freeze(this.coordinates);
    Object.freeze(this);
  }

  get utilization() { return Math.min(100, Math.round((this.loadKg / this.capacityKg) * 100)); }
  get distanceKm() { return Number(this.route?.distanceKm ?? this.fallbackDistanceKm ?? 0); }
  get durationMin() { return Number(this.route?.durationMin ?? this.fallbackDurationMin ?? 0); }
  get coordinates() { return this.route?.coordinates ?? this.fallbackCoordinates ?? []; }
  get source() { return this.route?.source ?? 'DEMO'; }
  get cost() { return this.distanceKm * this.costPerKm; }
  get savingKm() { return Math.max(0, this.baselineKm - this.distanceKm); }

  withCalculatedRoute(route) {
    return new RoutePlan({ ...this, route: structuredClone(route) });
  }
}


/* src/application/use-cases/load-route-dashboard.js */

class LoadRouteDashboard {
  constructor(repository, routingService) {
    this.repository = repository;
    this.routingService = routingService;
  }

  async execute() {
    const raw = await this.repository.getDashboardData();
    const routes = await Promise.all(raw.routes.map(async item => {
      const entity = new RoutePlan(item);
      try {
        const calculated = await this.routingService.calculate(entity);
        return entity.withCalculatedRoute(calculated);
      } catch {
        return entity.withCalculatedRoute({
          source: 'DEMO OFFLINE',
          distanceKm: entity.fallbackDistanceKm,
          durationMin: entity.fallbackDurationMin,
          coordinates: entity.fallbackCoordinates
        });
      }
    }));

    return Object.freeze({
      ...raw,
      routes: Object.freeze(routes.map(route => this.#toViewModel(route)))
    });
  }

  #toViewModel(route) {
    return Object.freeze({
      ...route,
      utilization: route.utilization,
      distanceKm: route.distanceKm,
      durationMin: route.durationMin,
      coordinates: route.coordinates,
      source: route.source,
      cost: route.cost,
      savingKm: route.savingKm,
      arrival: this.#addMinutes(route.departure, route.durationMin)
    });
  }

  #addMinutes(hhmm, minutes) {
    const [hours, mins] = hhmm.split(':').map(Number);
    const total = hours * 60 + mins + Math.round(minutes);
    return `${String(Math.floor(total / 60) % 24).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`;
  }
}

/* src/infrastructure/routing/osrm-routing-service.js */

class OsrmRoutingService extends RoutingService {
  constructor({ baseUrl = 'https://router.project-osrm.org', timeoutMs = 4500, fetchImpl = globalThis.fetch } = {}) {
    super();
    this.baseUrl = baseUrl;
    this.timeoutMs = timeoutMs;
    this.fetchImpl = fetchImpl;
  }

  async calculate(route) {
    if (!this.fetchImpl) throw new Error('Fetch indisponível');
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), this.timeoutMs);
    const routePoints=[route.origin,...(route.stops||[])];
    const last=routePoints.at(-1);
    if(!last || Math.abs(Number(last.lat)-Number(route.destination.lat))>.0001 || Math.abs(Number(last.lng)-Number(route.destination.lng))>.0001) routePoints.push(route.destination);
    const points=routePoints.map(point=>`${point.lng},${point.lat}`).join(';');
    try {
      const response = await this.fetchImpl(`${this.baseUrl}/route/v1/driving/${points}?overview=full&geometries=geojson&steps=false`, { signal: controller.signal });
      if (!response.ok) throw new Error(`OSRM HTTP ${response.status}`);
      const payload = await response.json();
      const result = payload.routes?.[0];
      if (!result?.geometry?.coordinates?.length) throw new Error('OSRM sem geometria');
      return {
        source: 'OSRM',
        distanceKm: result.distance / 1000,
        durationMin: result.duration / 60,
        coordinates: result.geometry.coordinates.map(([lng, lat]) => [lat, lng])
      };
    } finally {
      clearTimeout(timer);
    }
  }
}


/* src/application/use-cases/filter-dashboard.js */
class FilterDashboard {
  execute(data, criteria = {}) {
    const normalizedOrder = String(criteria.order ?? '').trim().toLowerCase();
    const routes = data.routes.filter(route =>
      (!criteria.region || route.region === criteria.region) &&
      (!criteria.vehicle || route.vehicle === criteria.vehicle) &&
      (!criteria.driver || route.driver === criteria.driver) &&
      (!normalizedOrder || route.order.toLowerCase().includes(normalizedOrder))
    );
    const routeIds = new Set(routes.map(route => route.id));
    return Object.freeze({
      ...data,
      routes: Object.freeze(routes),
      deliveries: Object.freeze(data.deliveries.filter(delivery => routeIds.has(delivery.route)))
    });
  }
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>'"]/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
  })[char]);
}

class SvgRouteMapAdapter {
  constructor(container, onSelect) {
    this.container = container;
    this.onSelect = onSelect;
    this.handlers = [];
  }

  mount(routes, selectedId) {
    if (!this.container) return;
    const all = routes.flatMap(route => route.coordinates);
    if (!all.length) return this.#empty();
    const lats = all.map(point => point[0]);
    const lngs = all.map(point => point[1]);
    const bounds = { minLat: Math.min(...lats), maxLat: Math.max(...lats), minLng: Math.min(...lngs), maxLng: Math.max(...lngs) };
    const project = ([lat, lng]) => {
      const x = 64 + ((lng - bounds.minLng) / Math.max(.001, bounds.maxLng - bounds.minLng)) * 792;
      const y = 485 - ((lat - bounds.minLat) / Math.max(.001, bounds.maxLat - bounds.minLat)) * 410;
      return [x, y];
    };
    const grid = Array.from({ length: 12 }, (_, i) => `<path d="M ${i*90} 0 L ${i*90} 560"/>`).join('') +
      Array.from({ length: 8 }, (_, i) => `<path d="M 0 ${i*80} L 920 ${i*80}"/>`).join('');
    const paths = routes.map(route => {
      const points = route.coordinates.map(project);
      const d = points.map(([x,y], index) => `${index ? 'L' : 'M'} ${x.toFixed(1)} ${y.toFixed(1)}`).join(' ');
      const [dx,dy] = points.at(-1);
      const active = route.id === selectedId;
      return `<g class="map-route ${active ? 'active' : ''}" data-map-route="${escapeHtml(route.id)}" role="button" tabindex="0" aria-label="Selecionar ${escapeHtml(route.name)} para ${escapeHtml(route.destination.name)}">
        <path class="route-shadow" d="${d}"/><path class="route-line" d="${d}" style="--route:${safeColor(route.color)}"/>
        ${points.slice(1,-1).map(([x,y]) => `<circle class="waypoint" cx="${x}" cy="${y}" r="4" style="--route:${safeColor(route.color)}"/>`).join('')}
        <g transform="translate(${dx} ${dy})"><circle class="destination-halo" r="16" style="--route:${safeColor(route.color)}"/><circle class="destination" r="8" style="--route:${safeColor(route.color)}"/></g>

/* src/infrastructure/maps/hybrid-route-map-adapter.js */

class HybridRouteMapAdapter {
  constructor(container, onSelect) {
    this.container=container; this.onSelect=onSelect; this.fallback=null; this.map=null; this.layers=[];
  }

  mount(routes, selectedId) {
    if(!this.container) return;
    if(!globalThis.L){this.fallback=new SvgRouteMapAdapter(this.container,this.onSelect);this.fallback.mount(routes,selectedId);return;}
    const L=globalThis.L;
    this.container.innerHTML='<div class="leaflet-host" aria-label="Mapa geográfico das rotas reais"></div>';
    const host=this.container.querySelector('.leaflet-host');
    this.map=L.map(host,{zoomControl:false,preferCanvas:false,attributionControl:true,zoomSnap:.25});
    L.control.zoom({position:'topright'}).addTo(this.map);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors',className:'modern-map-tiles'}).addTo(this.map);
    this.map.createPane('routeGlowPane');this.map.getPane('routeGlowPane').style.zIndex=390;this.map.getPane('routeGlowPane').style.pointerEvents='none';
    this.map.createPane('routeBasePane');this.map.getPane('routeBasePane').style.zIndex=400;
    this.map.createPane('routeShinePane');this.map.getPane('routeShinePane').style.zIndex=410;this.map.getPane('routeShinePane').style.pointerEvents='none';
    if(!routes.length) return;

    const origin=routes[0].origin;
    const hubHtml='<div class="hub-modern"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 4l9 6.5v8.2a1.3 1.3 0 0 1-1.3 1.3H4.3A1.3 1.3 0 0 1 3 18.7v-8.2Zm4 1.2v6.1h3.3v-6.1H7Zm6.1 0v2.2H18v-2.2h-4.9Zm0 3.4v2.7H18v-2.7h-4.9Z"/></svg></div>';
    const depot=L.marker([origin.lat,origin.lng],{icon:L.divIcon({className:'',html:hubHtml,iconSize:[42,42],iconAnchor:[21,21]}),zIndexOffset:1200}).addTo(this.map).bindPopup('<b>Hub Principal</b><br>Vitória da Conquista - BA<br><small>Origem das ordens de carga planejadas</small>');
    this.layers.push(depot);

    const all=[];
    routes.forEach(route=>{
      const coords=route.coordinates||route.fallbackCoordinates||[]; if(!coords.length)return; all.push(...coords);
      const active=route.id===selectedId;
      const color=safeColor(route.color);
      const glow=L.polyline(coords,{pane:'routeGlowPane',color,weight:active?18:14,opacity:active?.20:.11,lineCap:'round',lineJoin:'round',className:'route-glow-path'}).addTo(this.map);
      const border=L.polyline(coords,{pane:'routeBasePane',color:'#03101c',weight:active?11:9,opacity:.92,lineCap:'round',lineJoin:'round'}).addTo(this.map);
      const core=L.polyline(coords,{pane:'routeBasePane',color,weight:active?6.5:5,opacity:active?1:.86,lineCap:'round',lineJoin:'round',className:'route-core-path'}).addTo(this.map);
      const shine=L.polyline(coords,{pane:'routeShinePane',color:'#ffffff',weight:active?2.1:1.4,opacity:active?.78:.46,lineCap:'round',className:'route-shimmer-path'}).addTo(this.map);
      [border,core].forEach(layer=>layer.on('click',()=>this.onSelect?.(route.id)));
      this.layers.push(glow,border,core,shine);

      const routeStops=(route.stops||[]).slice().sort((a,b)=>a.seq-b.seq);
      routeStops.forEach((stop,index)=>{
        const isFirst=index===0, isFinal=index===routeStops.length-1;
        let html;
        if(isFinal){
          html=`<div class="delivery-stop final" style="--pin:${color}"><svg viewBox="0 0 24 24"><path d="M5 3h2v18H5V3Zm3 1h10l-2.2 3L18 10H8V4Zm2 2v2h5.1l-.7-1 .7-1H10Z"/></svg><em>Entrega final</em></div>`;
        }else if(isFirst){
          html=`<div class="delivery-stop first" style="--pin:${color}"><span>1</span><em>1ª entrega</em></div>`;
        }else{
          html=`<div class="delivery-stop" style="--pin:${color}">${stop.seq}</div>`;
        }
        const marker=L.marker([stop.lat,stop.lng],{icon:L.divIcon({className:'',html,iconSize:[isFinal?34:isFirst?32:27,isFinal?34:isFirst?32:27],iconAnchor:[isFinal?17:isFirst?16:13.5,isFinal?17:isFirst?16:13.5]}),zIndexOffset:1050+(stop.seq||0)}).addTo(this.map);
        marker.bindPopup(`<b>${isFinal?'Entrega final':isFirst?'Primeira entrega':'Parada '+stop.seq}</b><br>${stop.city}<br>${stop.client}<br><small>${route.order} · ${route.name}</small>`);
        this.layers.push(marker);
      });

      const truckIndex=Math.max(0,Math.floor((coords.length-1)*(route.progress??.42)));
      const truckPoint=coords[truckIndex];
      if(truckPoint){
        const truckHtml=`<div class="truck-modern" style="--pin:${color}"><svg viewBox="0 0 24 24"><path d="M3 5h11v9h2.3l1.7-3h2.4l1.6 2.5V17h-2.2a3 3 0 0 1-5.6 0H9.8a3 3 0 0 1-5.6 0H2V7a2 2 0 0 1 1-2Zm2 2v6h7V7H5Zm12.4 6H19l-.8-1.2-.8 1.2ZM7 18.2a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4Zm10 0a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4Z"/></svg></div>`;
        const truck=L.marker(truckPoint,{icon:L.divIcon({className:'',html:truckHtml,iconSize:[42,30],iconAnchor:[21,15]}),zIndexOffset:1150}).addTo(this.map).bindPopup(`<b>${route.plate}</b><br>${route.driver}<br>${route.status}<br><small>${route.order} · ${Math.round(route.distanceKm)} km</small>`);
        this.layers.push(truck);
      }

      const labelIndex=Math.max(1,Math.min(coords.length-2,Math.floor((coords.length-1)*.68)));
      const labelPoint=coords[labelIndex];
      if(labelPoint){
        const labelHtml=`<div class="route-map-label" style="--pin:${color}"><i></i><b>${route.name}</b><span>${Math.round(route.distanceKm)} km</span></div>`;
        const label=L.marker(labelPoint,{interactive:false,icon:L.divIcon({className:'',html:labelHtml,iconSize:[130,30],iconAnchor:[65,15]}),zIndexOffset:900}).addTo(this.map);this.layers.push(label);
      }
    });
    const bounds=L.latLngBounds(all);if(bounds.isValid())this.map.fitBounds(bounds,{paddingTopLeft:[40,40],paddingBottomRight:[40,54]});
    requestAnimationFrame(()=>this.map?.invalidateSize());
  }

  destroy(){this.fallback?.destroy();this.fallback=null;if(this.map)this.map.remove();this.map=null;this.layers=[];if(this.container)this.container.replaceChildren();}
}


/* src/infrastructure/visualization/route-3d-renderer.js */

class Route3DRenderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas?.getContext('2d');
    this.angle = -0.22;
    this.frame = 0;
    this.resizeObserver = null;
  }

  mount(routes) {
    if (!this.ctx) return;
    this.routes = routes;
    this.#resize();
    this.resizeObserver = new ResizeObserver(() => this.#resize());
    this.resizeObserver.observe(this.canvas.parentElement);
    this.canvas.addEventListener('pointermove', this.#pointer);
    this.#draw();
  }

  #pointer = event => {
    if (event.buttons !== 1) return;
    this.angle += event.movementX * .006;
  };

  #resize() {
    const rect = this.canvas.parentElement.getBoundingClientRect();
    const ratio = Math.min(2, globalThis.devicePixelRatio || 1);
    this.canvas.width = Math.max(1, rect.width * ratio);
    this.canvas.height = Math.max(1, rect.height * ratio);
    this.canvas.style.width = `${rect.width}px`;
    this.canvas.style.height = `${rect.height}px`;
    this.ctx.setTransform(ratio,0,0,ratio,0,0);
  }

  #draw = () => {
    const width = this.canvas.clientWidth, height = this.canvas.clientHeight, ctx = this.ctx;
    ctx.clearRect(0,0,width,height);
    const cx = width*.5, cy = height*.58;
    const project = (x,z,y=0) => {
      const cos=Math.cos(this.angle), sin=Math.sin(this.angle), rx=x*cos-z*sin, rz=x*sin+z*cos;
      return [cx+rx, cy+rz*.33-y];
    };
    ctx.strokeStyle='rgba(48,130,195,.22)'; ctx.lineWidth=1;
    for(let i=-10;i<=10;i++){
      const a=project(i*30,-230),b=project(i*30,230),c=project(-300,i*23),d=project(300,i*23);
      ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.moveTo(...c);ctx.lineTo(...d);ctx.stroke();
    }
    const hubs=[[-170,-40],[174,-82],[-85,-155]];
    this.routes.forEach((route,index)=>{
      const target=hubs[index] ?? [0,-130-index*20], start=[0,80], color=safeColor(route.color);
      ctx.strokeStyle=color;ctx.shadowColor=color;ctx.shadowBlur=10;ctx.lineWidth=3;
      ctx.beginPath();
      for(let step=0;step<=32;step++){
        const t=step/32, bend=Math.sin(t*Math.PI)*(index-1)*50;
        const x=start[0]+(target[0]-start[0])*t+bend,z=start[1]+(target[1]-start[1])*t,y=Math.sin(t*Math.PI)*38;
        const p=project(x,z,y); step?ctx.lineTo(...p):ctx.moveTo(...p);
      }
      ctx.stroke();ctx.shadowBlur=0;
      const [x,y]=project(target[0],target[1],9);
      ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fill();
      ctx.font='600 12px Segoe UI';ctx.fillStyle='#eff8ff';ctx.fillText(route.destination.name.split(' - ')[0],x+12,y+4);
      const pulse=(Date.now()/650+index)%1;
      const [px,py]=project(start[0]+(target[0]-start[0])*pulse,start[1]+(target[1]-start[1])*pulse,Math.sin(pulse*Math.PI)*38);
      ctx.fillStyle=color;ctx.beginPath();ctx.arc(px,py,4,0,Math.PI*2);ctx.fill();
    });
    const [hx,hy]=project(0,80,10);ctx.fillStyle='#36b7ff';ctx.beginPath();ctx.arc(hx,hy,8,0,Math.PI*2);ctx.fill();
    ctx.font='700 12px Segoe UI';ctx.fillStyle='#dff5ff';ctx.fillText('Vitória da Conquista',hx+13,hy+4);
    this.frame=requestAnimationFrame(this.#draw);
  };

  dispose() {
    cancelAnimationFrame(this.frame);
    this.resizeObserver?.disconnect();
    this.canvas?.removeEventListener('pointermove', this.#pointer);
  }
}

class PlanningView {
  constructor(root) { this.root = root; }

  render(data, selectedId, onSelect) {
    if (!data.routes.length) { this.root.innerHTML = empty('Ajuste os filtros para voltar a visualizar o planejamento.'); return; }
    const totalKm=data.routes.reduce((sum,route)=>sum+route.distanceKm,0);
    const totalCost=data.routes.reduce((sum,route)=>sum+route.cost,0);
    const eta=data.routes.reduce((sum,route)=>sum+route.durationMin,0)/data.routes.length;
    const inTransit=data.vehicles.filter(v=>v.status==='Em rota').length;
    const available=data.vehicles.filter(v=>v.status==='Disponível').length;
    const returned=data.vehicles.filter(v=>v.status==='Retornado').length;
    const mdfeTransit=data.mdfes.filter(m=>m.status==='Em trânsito').length;
    const advances=data.tripFinance.filter(x=>x.type==='Adiantamento').reduce((s,x)=>s+x.value,0);
    const pending=data.tripFinance.filter(x=>String(x.status).includes('Pendente')).reduce((s,x)=>s+x.value,0);

      {icon:'▤',label:'Ordens de carga',value:data.routes.length,note:'rotas consolidadas'},

      {icon:'▰',label:'Veículos em trânsito',value:inTransit,note:'acompanhamento operacional'},

class ShellView {
  constructor(root) { this.root = root; this.handlers = {}; }
  on(event, handler) { this.handlers[event] = handler; }

  render() {
    this.root.innerHTML = `<div class="app-shell">
      <aside class="sidebar">
        <div class="brand"><div class="brand-mark"><span></span><span></span><span></span></div><div><b>OMNIROUTE</b><small>TMS INTELLIGENCE</small></div></div>
        <nav class="nav" aria-label="Navegação principal">${NAV.map(([id,ico,label]) => `<button type="button" data-view="${id}" aria-current="${id==='planning'?'page':'false'}"><span aria-hidden="true">${ico}</span><span>${label}</span></button>`).join('')}</nav>
        <div class="side-health"><span class="online-dot"></span><div><b>Operação conectada</b><small>Protótipo visual · dados simulados</small></div></div>
      </aside>
      <main class="main">
        <header class="topbar">
          <button class="mobile-menu" id="menu-toggle" aria-label="Abrir navegação">☰</button>
          <div class="title-block"><span class="eyebrow">LOGIX TMS · BAHIA</span><h1 id="page-title"></h1><p id="page-subtitle"></p></div>
          <div class="user-status"><span class="online-dot"></span><div><b>Sistema online</b><small>Administrador · Empresa</small></div><span class="avatar">AD</span></div>
          <form class="filters" id="filters">
            <label><span>Período</span><select id="period"><option>Hoje</option><option>Próximos 7 dias</option><option>Últimos 30 dias</option></select></label>
            <label><span>Região</span><select id="region"><option value="">Todas as regiões</option></select></label>
            <label><span>Veículo</span><select id="vehicle"><option value="">Todos os veículos</option></select></label>
            <label><span>Motorista</span><select id="driver"><option value="">Todos os motoristas</option></select></label>
            <label><span>Ordem de carga</span><input id="order" placeholder="Ex.: OC-1045" autocomplete="off"></label>
            <button class="primary" type="submit">↻ Atualizar</button>
          </form>
        </header>
        <section class="content" id="view" tabindex="-1"></section>
      </main>
    </div><div class="toast" id="toast" role="status"></div>`;
    this.root.querySelectorAll('[data-view]').forEach(button => button.addEventListener('click', () => this.handlers.navigate?.(button.dataset.view)));
    this.root.querySelector('#filters').addEventListener('submit', event => { event.preventDefault(); this.handlers.refresh?.(); });
    ['region','vehicle','driver','order'].forEach(id => this.root.querySelector(`#${id}`).addEventListener(id==='order'?'input':'change', () => this.handlers.filter?.()));
    this.root.querySelector('#menu-toggle').addEventListener('click', () => this.root.querySelector('.sidebar').classList.toggle('open'));
  }

  setActive(view) {
    const title = TITLES[view] ?? TITLES.planning;
    this.root.querySelector('#page-title').textContent = title[0];
    this.root.querySelector('#page-subtitle').textContent = title[1];
    this.root.querySelectorAll('[data-view]').forEach(button => button.setAttribute('aria-current', button.dataset.view===view?'page':'false'));
    this.root.querySelector('#filters').classList.toggle('hidden', !['planning','operations','mdfe','orders','deliveries','finance'].includes(view));
    this.root.querySelector('.sidebar').classList.remove('open');
  }

  fillFilters(data) {
    const setOptions = (id, label, values) => {
      this.root.querySelector(`#${id}`).innerHTML = `<option value="">${escapeHtml(label)}</option>${[...new Set(values)].map(value => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`).join('')}`;
    };
    setOptions('region','Todas as regiões',data.routes.map(route=>route.region));
    setOptions('vehicle','Todos os veículos',data.routes.map(route=>route.vehicle));
    setOptions('driver','Todos os motoristas',data.routes.map(route=>route.driver));
  }

  getFilters() { return ['region','vehicle','driver','order'].reduce((result,id) => ({ ...result, [id]: this.root.querySelector(`#${id}`).value }), {}); }
  toast(message) { const toast = this.root.querySelector('#toast'); toast.textContent=message; toast.classList.add('show'); clearTimeout(this.toastTimer); this.toastTimer=setTimeout(()=>toast.classList.remove('show'),2600); }
}

  drivers(data) { return `${pageHeading('Motoristas','Desempenho, jornada e pontualidade',`${data.drivers.length} motoristas`)}<div class="entity-grid">${data.drivers.map(d=>`<article class="entity-card"><div class="entity-top"><span class="driver-avatar">${d.name.split(' ').map(x=>x[0]).slice(0,2).join('')}</span><div><h3>${escapeHtml(d.name)}</h3><p>${escapeHtml(d.vehicle)} · ${escapeHtml(d.route)}</p></div>${badge(d.status)}</div><div class="metric-row"><span><b>${d.score}</b><small>Score</small></span><span><b>${d.onTime}%</b><small>No prazo</small></span><span><b>${escapeHtml(d.hours)}</b><small>Jornada</small></span></div><div class="card-foot"><span>${d.deliveries} entregas registradas</span></div></article>`).join('')}</div>`; },

  deliveries(data) { return `${pageHeading('Entregas','Sequência operacional e janelas de atendimento',`${data.deliveries.length} entregas`)}${data.deliveries.length?`<article class="panel table-panel"><div class="table-wrap"><table><thead><tr><th>Seq.</th><th>Ordem</th><th>Rota</th><th>Cidade</th><th>Cliente</th><th>Janela</th><th>Peso</th><th>Status</th></tr></thead><tbody>${data.deliveries.map(d=>`<tr><td>${d.seq}</td><td><b>${escapeHtml(d.order)}</b></td><td>${escapeHtml(d.route)}</td><td>${escapeHtml(d.city)}</td><td>${escapeHtml(d.client)}</td><td>${escapeHtml(d.window)}</td><td>${number(d.weight)} kg</td><td>${badge(d.status)}</td></tr>`).join('')}</tbody></table></div></article>`:empty()}`; },

  reports(data) {

function bars(items,label,width,value,tone='blue') { return `<div class="bars">${items.map(item=>`<div class="bar-row"><span>${escapeHtml(label(item))}</span><i><b style="width:${Math.min(100,width(item))}%;--tone:${tone}"></b></i><strong>${escapeHtml(value(item))}</strong></div>`).join('')}</div>`; }


/* src/presentation/dashboard-controller.js */






class DashboardController {
  constructor(root, loadDashboard) { this.root=root; this.loadDashboard=loadDashboard; this.filterDashboard=new FilterDashboard(); this.shell=new ShellView(root); this.currentView='planning'; this.selectedRoute='R1'; }
  async init() { this.shell.render(); this.shell.on('navigate',view=>this.navigate(view)); this.shell.on('filter',()=>this.applyFilters()); this.shell.on('refresh',()=>this.refresh()); this.#showLoading(); this.data=await this.loadDashboard.execute(); this.filtered=this.data; this.shell.fillFilters(this.data); this.navigate('planning'); }
  navigate(view) { this.currentView=view; this.shell.setActive(view); this.render(); this.root.querySelector('#view')?.focus({preventScroll:true}); }
  applyFilters() { this.filtered=this.filterDashboard.execute(this.data,this.shell.getFilters()); if(!this.filtered.routes.some(r=>r.id===this.selectedRoute))this.selectedRoute=this.filtered.routes[0]?.id; this.render(); }
  async refresh() { this.shell.toast('Atualizando rotas e estimativas…'); try{this.data=await this.loadDashboard.execute();this.filtered=this.filterDashboard.execute(this.data,this.shell.getFilters());this.render();this.shell.toast('Planejamento atualizado com sucesso.')}catch(error){console.error(error);this.shell.toast('Não foi possível atualizar. Os dados atuais foram mantidos.')} }
  render() { this.#disposeVisuals(); const container=this.root.querySelector('#view'); if(this.currentView==='planning'){const planning=new PlanningView(container);planning.render(this.filtered,this.selectedRoute,id=>{this.selectedRoute=id;this.render()});requestAnimationFrame(()=>{const mapElement=this.root.querySelector('#route-map');if(mapElement){this.map=new HybridRouteMapAdapter(mapElement,id=>{this.selectedRoute=id;this.render()});this.map.mount(this.filtered.routes,this.selectedRoute)}const canvas=this.root.querySelector('#network-3d');if(canvas){this.renderer3d=new Route3DRenderer(canvas);this.renderer3d.mount(this.filtered.routes)}});return}const renderer=viewRenderers[this.currentView];container.innerHTML=renderer?renderer(this.filtered):'<div class="empty-state">Tela indisponível.</div>'; }
  #showLoading(){this.root.querySelector('#view').innerHTML='<div class="loading"><span></span><strong>Preparando o planejamento logístico…</strong></div>'}
  #disposeVisuals(){this.map?.destroy();this.renderer3d?.dispose();this.map=null;this.renderer3d=null}
}


/* src/main.js */




async function bootstrap() {
  const root = document.querySelector('#app');
  const repository = new MockTmsRepository();
  const routing = new OsrmRoutingService();
  const loadDashboard = new LoadRouteDashboard(repository, routing);
  await new DashboardController(root, loadDashboard).init();
}

bootstrap().catch(error => {
  console.error(error);
  document.querySelector('#app').innerHTML = '<main class="fatal-error"><h1>OmniRoute TMS</h1><p>Não foi possível iniciar o painel. Recarregue a página para tentar novamente.</p></main>';
});
